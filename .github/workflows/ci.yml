name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/peyhunter/pey-code-portfolio

jobs:
  # ---------- Job 1: turn the code into an image ----------
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image (push only from main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Job 2: tell the cluster repo about it ----------
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Check out the cluster repo
        uses: actions/checkout@v7
        with:
          repository: PeyHunter/k3s-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Point the portfolio at the new image
        run: |
          sed -i -E "s|newTag: .*|newTag: \"${TAG}\"|" portfolio/kustomization.yaml
          grep newTag portfolio/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/kustomization.yaml
          git diff --cached --quiet && { echo "Already on ${TAG}"; exit 0; }
          git commit -m "portfolio: deploy ${TAG}"
          git push
